name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: Go, Swift, and app bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Swift self-tests
        run: ./macos-app/scripts/test-swift.sh

      - name: Build signed app bundle
        run: GO_BIN="$(command -v go)" ./macos-app/scripts/build-app.sh

      - name: Verify bundle metadata and signature
        run: |
          plutil -lint "dist/Anti Gravity NodeGuard.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "dist/Anti Gravity NodeGuard.app"
          "dist/Anti Gravity NodeGuard.app/Contents/Resources/ag-nodeguard" version
